[pytest]
# Test files here are named without a test_/​_test marker and in camelCase
# (e.g. tests/decisionEngine.py), so the default python_files pattern
# (test_*.py / *_test.py) wouldn't discover them. Test *functions* still
# have to start with test_ -- that's a pytest requirement independent of
# file naming, so python_functions is left at its default.
#
# python_files = *.py matches every .py file, so it must be scoped to
# tests/ only (testpaths) -- otherwise pytest tries to import source files
# project-wide (topology.py, src/decision/*.py, scripts/*.py, ...) as test
# modules and fails on their real, unrelated import requirements (e.g.
# topology.py needs the mininet package, which isn't part of this venv).
testpaths = tests
python_files = *.py
