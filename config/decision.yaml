# Decision Engine Configuration
# Stability-aware rerouting parameters

thresholds:
  utilization: 0.7
  delay_ms: 100
  loss_rate: 0.01
  delay_increase_ratio: 1.5
  consecutive_violations: 3

hysteresis:
  persistence_seconds: 5
  cooldown_seconds: 10
  enter_threshold: 0.70
  release_threshold: 0.65

minimum_improvement:
  # Churn-adaptive threshold (added 2026-08-20): the *_cost_reduction values
  # below are now the ceiling, used only when the affected link(s) have a
  # saturated recent churn_score (1.0 -- already flapping, stay cautious,
  # identical to this project's original fixed-threshold behavior). The
  # *_cost_reduction_low_churn values are the floor, used when churn_score
  # is 0 (no recent instability -- a real, if modest, improvement shouldn't
  # be blocked just because the fixed 0.15 threshold happens to be a bit
  # too strict for this specific case). Linearly interpolated by churn_score
  # in between. See DecisionEngine._execute_reroute() and
  # compliance_check.md's "Churn-adaptive minimum-improvement threshold"
  # section for the real congestion.py scenario that motivated this (a
  # genuine ~10% cost improvement was blocked by the flat 0.15 threshold
  # combined with the offered-load self-influence correction, on a link
  # with zero churn history).
  absolute_cost_reduction: 0.1
  relative_cost_reduction: 0.15
  absolute_cost_reduction_low_churn: 0.03
  relative_cost_reduction_low_churn: 0.05

change_budget:
  max_updates_per_minute: 10
  max_path_changes_per_minute: 5
  burst_allowance: 3

hold_down:
  enabled: true
  duration_seconds: 10

recovery:
  window_seconds: 5

resilience_avoidance:
  # Structural avoidance for links with a real resilience anomaly (flapping,
  # sustained abnormal loss, abnormal traffic growth -- see
  # NetworkState.get_resilience_score). Disabled by default: no existing
  # scenario's links ever accumulate a nonzero resilience_score, so this
  # only changes behavior for a caller/scenario that explicitly enables it.
  #
  # The 3 underlying signals are grounded, not hand-picked: flapping follows
  # RFC 2439's BGP route flap damping shape (exponential-decay penalty +
  # suppress/reuse hysteresis, rescaled from BGP's minutes-scale defaults to
  # this project's seconds-scale stability timers -- see
  # LinkFlapTracker's docstring); abnormal loss / traffic growth both use
  # 3-sigma shift detection (Shewhart-control-chart convention, standard in
  # network anomaly detection -- see LossJitterTracker.get_abnormal_loss_score
  # and LinkHistory.traffic_growth_score). avoid_threshold itself (how much
  # of that already-principled [0,1] score counts as "avoid this link") is
  # now also data-driven rather than hand-picked: experiments/resilience_
  # sensitivity.py runs a ROC / Youden's-J search (standard threshold-
  # selection methodology for a labeled detector score, e.g. PMC2749250;
  # mirrors how SDN link-failure literature separates failure-free vs
  # broken parameter distributions before picking a trip point, e.g. IEEE
  # 9531440) over randomized synthetic instances of "genuinely flapping" vs
  # "one legitimate transition". At half_life_seconds=20 (LinkFlapTracker's
  # own default), Youden's J is maximized (J=1.0, TPR=1.0, FPR=0.0 -- perfect
  # separation) across threshold in [0.50, 0.64]; 0.57 is that plateau's
  # midpoint, chosen over either edge for robustness to model misspecification
  # rather than sitting exactly on the boundary. Still synthetic ground
  # truth, not independently validated against real hardware traffic -- see
  # resilience_sensitivity.py's own module docstring for that same caveat.
  enabled: false
  avoid_threshold: 0.57

path_cost_weights:
  alpha: 0.4
  beta: 0.3
  gamma: 0.2
  delta: 0.05    # link instability/churn weight (recently-changed links cost more)
  epsilon: 0.05
  zeta: 0.05     # delay-residual jitter weight (recently-volatile links cost more)
  eta: 0.05      # loss-residual jitter weight (same idea, added 2026-08-19 after
                 # Breusch-Pagan confirmed loss_residual is heteroscedastic too)
                 # zeta/eta starting defaults matching delta/epsilon, not yet tuned
                 # -- see compliance_check.md 2026-08-19 and pending task notes.
                 # (A PCA-based composite merging alpha/beta/gamma/delta into one
                 # term was tried and reverted the same day -- see
                 # compliance_check.md's "Composite congestion indicator" section.)
